<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب جديد - ذيبان AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ربط ملف التصميم الخارجي الموحد -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="px-4 py-12">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-8 shadow-2xl space-y-6 relative">
        <div class="text-center space-y-2">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-cyan-500/10 items-center justify-center text-2xl text-cyan-400 font-bold mb-2">🐺</div>
            <h2 class="text-3xl font-black">انضم إلى ذيبان AI</h2>
            <p class="text-sm text-slate-400">أنشئ حسابك الجديد وابدأ رحلتك الذكية في التجارة</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الاسم الأول</label>
                    <input type="text" id="firstName" required class="w-full px-4 py-3 rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الاسم الثاني (العائلة)</label>
                    <input type="text" id="lastName" required class="w-full px-4 py-3 rounded-xl text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="05xxxxxxxx" required class="w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">تاريخ الميلاد</label>
                <input type="date" id="birthDate" required class="w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="name@example.com" required class="w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-xl btn-primary-custom text-base">
                تسجيل الحساب 🚀
            </button>
            <p id="formStatus" role="alert" class="text-sm text-red-300"></p>
        </form>

        <p class="text-center text-sm text-slate-400">
            لديك حساب بالفعل؟ <a href="login.html" class="text-cyan-400 font-bold hover:underline">سجل دخولك من هنا</a>
        </p>
    </div>

    <script src="supabase.js"></script>
    <!-- ربط ملف الجافاسكريبت الخاص بإنشاء الحساب -->
    <script src="signup.js"></script>
</body>
</html>
