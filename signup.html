<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إنشاء حساب | ذيبان AI</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-card"><div class="auth-brand"><div class="brand-mark">🐺</div><h1>انضم إلى ذيبان AI</h1><p>أنشئ حسابك وابدأ أول خطوة نحو متجر أذكى.</p></div><form id="signupForm"><div class="grid grid-cols-2 gap-4"><div class="field"><label for="firstName">الاسم الأول</label><input id="firstName" type="text" autocomplete="given-name" required></div><div class="field"><label for="lastName">اسم العائلة</label><input id="lastName" type="text" autocomplete="family-name" required></div></div><div class="field"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" placeholder="05xxxxxxxx" autocomplete="tel" required></div><div class="field"><label for="birthDate">تاريخ الميلاد</label><input id="birthDate" type="date" required></div><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" minlength="6" required></div><button id="submitBtn" class="btn-primary-custom" type="submit">إنشاء الحساب 🚀</button><p id="formStatus" class="form-status" role="alert"></p></form><p class="auth-bottom">لديك حساب؟ <a href="login.html">سجل دخولك من هنا</a></p></main><script type="module" src="signup.js"></script></body></html>
