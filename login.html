<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل الدخول | ذيبان AI</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-card"><div class="auth-brand"><div class="brand-mark"><img src="assets/dhiban-logo.png" alt="شعار ذيبان AI"></div><h1>أهلاً بك يا ذيبان</h1><p>سجّل دخولك وخلّ الذكاء يشتغل عنك.</p></div><form id="loginForm"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" required></div><div class="forgot-wrap"><button id="forgotBtn" type="button">نسيت كلمة المرور يا ذيبان؟</button></div><button class="btn-primary-custom" type="submit">تسجيل الدخول 🔓</button><p id="formStatus" class="form-status" role="alert"></p></form><p class="auth-bottom">ليس لديك حساب؟ <a href="signup.html">أنشئ حساباً جديداً</a></p></main><div id="resetModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><div class="modal-card"><button id="closeReset" class="modal-close" aria-label="إغلاق">×</button><h2 id="resetTitle">استعادة كلمة المرور</h2><p class="muted">اكتب بريدك وسنرسل لك رابطاً آمناً لإنشاء كلمة مرور جديدة.</p><form id="resetForm"><div class="field"><label for="resetEmail">البريد الإلكتروني</label><input id="resetEmail" type="email" placeholder="name@example.com" required></div><button id="resetBtn" class="btn-primary-custom" type="submit">إرسال رابط الاستعادة</button><p id="resetStatus" class="form-status" role="alert"></p></form></div></div><script type="module" src="login.js"></script></body></html>
