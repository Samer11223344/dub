<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ذيبان AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ربط ملف التصميم الخارجي الموحد -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="px-4 py-12">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-cyan-500/10 items-center justify-center text-2xl text-cyan-400 font-bold mb-2">🐺</div>
            <h2 class="text-3xl font-black">أهلاً بك يا ذيبان</h2>
            <p class="text-sm text-slate-400">سجل دخولك لمتابعة أعمالك وخدماتك</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="name@example.com" required class="w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl btn-primary-custom text-base text-slate-950 font-black">
                تسجيل الدخول 🔓
            </button>
            <p id="formStatus" role="alert" class="text-sm text-red-300"></p>
        </form>

        <p class="text-center text-sm text-slate-400">
            ليس لديك حساب؟ <a href="signup.html" class="text-cyan-400 font-bold hover:underline">أنشئ حساباً جديداً</a>
        </p>
    </div>

    <script src="supabase.js"></script>
    <!-- ربط ملف الجافاسكريبت الخاص بتسجيل الدخول -->
    <script src="login.js"></script>
</body>
</html>
